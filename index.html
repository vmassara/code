<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7-0 · World Cup Draft</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--surface:#0e0e1c;--card:#14142a;--border:#22223a;
  --gold:#c9a227;--gold-d:#8a6a0a;--gold-l:#e8c84a;--gold-bright:#f5d76e;
  --red:#cc2233;--red-l:#ff3344;
  --cream:#f0ead8;--muted:#9090b0;--faint:#32324a;
  --bat:#5ba8f0;--ar:#e08838;--wk:#a060e0;--bowl:#38c878;
  --accent:#c9a227;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px 8px;color:var(--cream)}
#app{width:100%;max-width:960px}

/* ── HEADER ── */
#hdr{background:linear-gradient(135deg,#0e0e1c,#14142a);border:1px solid var(--gold-d);border-radius:12px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;overflow:hidden}
#hdr::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(201,162,39,.08),transparent 60%);pointer-events:none}
#hdr-logo{height:52px;width:52px;object-fit:contain;flex-shrink:0;margin-right:10px;filter:drop-shadow(0 2px 6px rgba(201,162,39,.5))}
#hdr-logo-placeholder{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;margin-right:10px;box-shadow:0 2px 10px rgba(201,162,39,.4)}
#hdr h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:var(--gold-bright);letter-spacing:-1px;line-height:1;text-shadow:0 0 20px rgba(201,162,39,.5)}
#hdr .sub{font-size:.64rem;color:var(--muted);margin-top:3px;letter-spacing:.4px}
#hdr-right{display:flex;align-items:center;gap:10px}
#hdr-count{font-size:1.8rem;font-weight:900;color:var(--gold);line-height:1;min-width:48px;text-align:right}
#hdr-clabel{font-size:.6rem;color:var(--faint);letter-spacing:.5px;text-transform:uppercase;text-align:right}
#hard-toggle{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 10px;font-size:.68rem;letter-spacing:.4px;border-radius:20px;cursor:pointer;text-transform:uppercase;transition:all .15s;white-space:nowrap}
#hard-toggle:hover{border-color:var(--gold);color:var(--gold)}
#hard-toggle.on{border-color:#f0a050;color:#f0a050}

#prog{height:3px;background:var(--border);border-radius:2px;margin-bottom:10px;overflow:hidden}
#prog-fill{height:3px;background:var(--gold);transition:width .4s ease;width:0%;border-radius:2px}

/* ── PHASE WRAPPER ── */
.phase{display:none}.phase.active{display:block}

/* ── DRAFT LAYOUT ── */
#draft-cols{display:grid;grid-template-columns:1fr 270px;gap:10px}
@media(max-width:660px){#draft-cols{grid-template-columns:1fr}}

/* SPIN ZONE */
#reel-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 16px;text-align:center;margin-bottom:10px;position:relative;overflow:hidden;min-height:100px;display:flex;align-items:center;justify-content:center}
#reel-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,rgba(212,168,75,.08),transparent 70%);pointer-events:none}
#reel{color:var(--cream)}
#reel .yr{display:inline-block;background:var(--gold);color:#000;font-weight:800;font-size:.78rem;padding:2px 10px;border-radius:20px;margin-bottom:6px}
#reel .flag{font-size:2.2rem;line-height:1.3}
#reel .tname{font-size:1.5rem;font-weight:800;color:#fff;line-height:1.2}
#reel .thost{font-size:.64rem;color:var(--faint);margin-top:4px;letter-spacing:.3px}
#reel .idle{color:var(--faint);font-size:.85rem}

#btn-spin{display:block;width:100%;background:linear-gradient(135deg,var(--gold-bright),var(--gold),var(--gold-d));color:#000;border:none;border-radius:40px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 20px rgba(201,162,39,.4);transition:transform .1s,box-shadow .1s;margin-bottom:8px}
#btn-spin:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(201,162,39,.6)}
#btn-spin:disabled{opacity:.35;cursor:not-allowed}

/* RE-SPIN BAR */
#respin-bar{display:none;gap:6px;margin-bottom:8px}
.rs-btn{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px;font-size:.68rem;font-weight:600;border-radius:7px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:all .12s}
.rs-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.rs-btn:disabled{opacity:.25;cursor:not-allowed}
#respin-count{font-size:.65rem;color:var(--faint);text-align:center;padding:2px 0}
.rs-pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin:0 2px}
.rs-pip.used{background:var(--border)}

/* SQUAD PANEL */
#squad-panel{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:8px;min-height:80px}
.sq-idle{color:var(--faint);font-size:.82rem;text-align:center;padding:24px 0;line-height:2}
.sq-idle strong{color:var(--muted)}
.sq-head{margin-bottom:10px}
.sq-title{font-size:1.05rem;font-weight:700;color:var(--cream)}
.sq-sub{font-size:.65rem;color:var(--faint);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.squad-hint{font-size:.7rem;color:var(--green);margin-bottom:8px;padding:5px 9px;background:rgba(34,197,94,.08);border-radius:6px;border:1px solid rgba(34,197,94,.18)}

/* Player grid */
.sq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media(max-width:500px){.sq-grid{grid-template-columns:repeat(2,1fr)}}

.pc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:pointer;transition:all .15s;position:relative;user-select:none}
.pc.avail:hover{border-color:var(--gold-d);background:#1e2e1e}
.pc.sel{border-color:var(--gold)!important;background:#242010!important;box-shadow:0 0 0 2px rgba(212,168,75,.35)!important}
.pc.avail{border-color:var(--green-d)}
.pc.taken{opacity:.28;pointer-events:none}
.pc.quota-full{opacity:.3;pointer-events:none}
.pc.taken::after{content:"✓";font-size:.72rem;font-weight:700;color:var(--gold);position:absolute;top:5px;right:7px}
.pc.quota-full::after{content:"FULL";font-size:.55rem;font-weight:700;color:var(--faint);position:absolute;top:5px;right:5px;letter-spacing:.3px}
.pc .pn{font-size:.8rem;font-weight:600;color:var(--cream);line-height:1.3;padding-right:22px}
.role-tag{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:3px;margin-top:3px;letter-spacing:.3px}
.role-tag.bat{background:rgba(106,176,245,.18);color:var(--bat)}
.role-tag.ar {background:rgba(240,160,80,.18);color:var(--ar)}
.role-tag.wk {background:rgba(192,128,240,.18);color:var(--wk)}
.role-tag.bowl{background:rgba(96,216,144,.18);color:var(--bowl)}
.pc .prating{position:absolute;top:7px;right:7px;font-size:.8rem;font-weight:700;color:var(--gold)}
.pc .pstat{font-size:.64rem;color:var(--faint);margin-top:4px;line-height:1.3}
body.hard-mode .pc .prating{visibility:hidden}
body.hard-mode .pc .pstat{display:none}

/* SPIN AGAIN button */
#btn-spin-again{display:none;width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:9px;font-size:.75rem;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;transition:all .12s;margin-top:6px}
#btn-spin-again:hover{border-color:var(--gold);color:var(--gold)}

/* ── TEAM PANEL ── */
#team-panel{position:sticky;top:10px}
#role-tracker{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}
.rtb{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;transition:all .2s}
.rtb .rl{font-size:.58rem;color:var(--faint);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.rtb .rd{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:3px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:all .2s}
.dot.on{border-color:transparent}
.rtb.bat .dot.on{background:var(--bat)}.rtb.ar .dot.on{background:var(--ar)}
.rtb.wk .dot.on{background:var(--wk)}.rtb.bowl .dot.on{background:var(--bowl)}
.rtb.full{border-color:var(--gold-d)}
.rtb.full .rl{color:var(--gold)}
.rtc{font-size:.64rem;color:var(--muted)}

#slots-list{margin-bottom:8px}
.slot{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--border);margin-bottom:3px;font-size:.74rem;min-height:34px}
.slot.empty{color:var(--faint);font-style:italic}
.slot.slot-target{cursor:pointer;border-color:var(--gold);color:var(--gold);background:rgba(212,168,75,.07);transition:all .12s}
.slot.slot-target:hover{background:rgba(212,168,75,.16);box-shadow:0 0 0 2px rgba(212,168,75,.25)}
.slot.slot-target.fit-good{border-color:#22a03c;color:#4ade80;background:rgba(34,160,60,.07)}
.slot.slot-target.fit-good:hover{background:rgba(34,160,60,.15);box-shadow:0 0 0 2px rgba(34,160,60,.3)}
.slot.slot-target.fit-ok{border-color:#d08020;color:#f0a840;background:rgba(208,128,32,.07)}
.slot.slot-target.fit-ok:hover{background:rgba(208,128,32,.14);box-shadow:0 0 0 2px rgba(208,128,32,.3)}
.slot.slot-target.fit-bad{border-color:var(--red);color:var(--red-l);background:rgba(204,34,51,.07)}
.slot.slot-target.fit-bad:hover{background:rgba(204,34,51,.14);box-shadow:0 0 0 2px rgba(204,34,51,.3)}
.fit-label{font-size:.55rem;font-weight:700;letter-spacing:.3px;margin-left:auto;padding:1px 5px;border-radius:3px;opacity:.85}
.fit-good .fit-label{background:rgba(34,160,60,.2);color:#4ade80}
.fit-ok .fit-label{background:rgba(208,128,32,.2);color:#f0a840}
.fit-bad .fit-label{background:rgba(204,34,51,.2);color:var(--red-l)}
.fit-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.slot-num{width:17px;height:17px;border-radius:50%;background:var(--border);color:var(--muted);font-size:.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot.filled .slot-num{background:var(--green-d);color:#fff}
.slot-name{font-weight:600;color:var(--cream);flex:1}
.slot-era{font-size:.58rem;color:var(--faint)}
.slot-v{font-size:.7rem;font-weight:700;color:var(--gold)}

#team-strength{padding:8px 0;margin-bottom:6px}
.str-row{display:flex;justify-content:space-between;font-size:.68rem;color:var(--faint);margin-bottom:4px}
.str-row span:last-child{color:var(--gold);font-weight:700}
.str-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.str-bar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold-bright));transition:width .4s}

#squad-grade{display:none;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.sg-row{display:flex;align-items:center;justify-content:space-between}
.sg-letter{font-size:2.4rem;font-weight:900;line-height:1}
.sg-S{color:var(--gold-l)}.sg-A{color:var(--bowl)}.sg-B{color:var(--bat)}.sg-C{color:var(--ar)}.sg-D{color:var(--red)}
.sg-tag{font-size:.78rem;color:var(--cream)}
.sg-avg{font-size:.62rem;color:var(--faint);margin-top:2px}
.sg-break{font-size:.64rem;color:var(--faint);margin-top:8px;border-top:1px solid var(--border);padding-top:7px;line-height:1.9}

#btn-sim{display:none;background:linear-gradient(135deg,var(--gold-bright),var(--gold),var(--gold-d));color:#000;border:none;border-radius:8px;padding:13px;font-size:.85rem;font-weight:800;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;box-shadow:0 4px 16px rgba(201,162,39,.4)}
#btn-sim:hover{opacity:.9;transform:translateY(-1px)}

/* ── SIM PHASE ── */
.team-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.tc_{border-radius:7px;padding:7px 8px;text-align:center;background:var(--surface);border:1px solid var(--border)}
.tc_.bat{border-color:rgba(106,176,245,.3)}.tc_.ar{border-color:rgba(240,160,80,.3)}
.tc_.wk{border-color:rgba(192,128,240,.3)}.tc_.bowl{border-color:rgba(96,216,144,.3)}
.tc_ .tn{font-size:.7rem;font-weight:600;color:var(--cream);line-height:1.25}
.tc_ .ts{font-size:.6rem;color:var(--faint);margin-top:1px}
.tc_ .tv{font-size:.78rem;font-weight:700;margin-top:2px}

.smry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc_{background:var(--card);border:1px solid var(--gold-d);border-radius:8px;padding:10px;text-align:center}
.sc_ .sv{font-size:1.5rem;font-weight:800;color:var(--gold-bright)}
.sc_ .sl{font-size:.6rem;color:var(--faint);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}

#momentum{margin-bottom:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px}
#momentum .mo-lbl{font-size:.6rem;color:var(--faint);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
#momentum .mo-dots{display:flex;gap:6px}
.mo-dot{flex:1;height:7px;border-radius:4px;background:var(--border);transition:background .3s}
.mo-dot.W{background:#22a03c}.mo-dot.L{background:var(--red)}

.match-nav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.match-nav-step{font-size:.68rem;color:var(--muted);flex:1;text-align:center}
#nav-prev,#nav-next{background:var(--surface);border:1px solid var(--border);padding:8px 14px;font-size:.7rem;font-weight:600;border-radius:6px;cursor:pointer;color:var(--muted);text-transform:uppercase;transition:all .12s}
#nav-prev:hover:not(:disabled),#nav-next:hover{border-color:var(--gold);color:var(--gold)}
#nav-prev:disabled{opacity:.25;cursor:not-allowed}
#nav-next.primary{background:var(--gold);color:#000;border-color:var(--gold)}

.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.mc-head{padding:12px 16px;background:var(--card);display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border)}
.mc-head .mt{font-size:.92rem;font-weight:700;color:var(--gold)}
.mc-head .ms{font-size:.62rem;color:var(--faint);letter-spacing:.6px;text-transform:uppercase;text-align:right;line-height:1.8}
.mc-scores{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.ms-team{text-align:center}
.ms-r{font-size:1.5rem;font-weight:800;color:var(--gold);line-height:1}
.ms-l{font-size:.58rem;color:var(--faint);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.ms-vs{color:var(--border);font-size:.8rem;flex:1;text-align:center}
.mc-body{padding:12px 16px}
.mc-sec{margin-bottom:10px}
.mc-sec-title{font-size:.58rem;color:var(--faint);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;border-bottom:1px solid var(--border);padding-bottom:3px}
table.sc-tbl{width:100%;border-collapse:collapse;font-size:.74rem}
table.sc-tbl th{font-size:.58rem;color:var(--faint);font-weight:500;padding:3px 4px;text-align:right;letter-spacing:.5px;text-transform:uppercase}
table.sc-tbl th:first-child{text-align:left}
table.sc-tbl td{padding:4px 4px;border-bottom:1px solid var(--border);color:var(--cream)}
table.sc-tbl td:not(:first-child){text-align:right;color:var(--muted)}
table.sc-tbl td.bold{font-weight:700;color:var(--cream)}
table.sc-tbl td.good{color:var(--bowl)}
table.sc-tbl td.bad{color:var(--red)}
table.sc-tbl tr.hi td{background:rgba(212,168,75,.06)}
table.sc-tbl tr.hi-bowl td{background:rgba(96,216,144,.06)}
.mc-total{font-size:.66rem;color:var(--faint);padding:5px 0 0;border-top:1px solid var(--border);margin-top:3px}
.mc-total strong{color:var(--muted)}
.match-moment{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin:8px 0;font-size:.74rem;color:var(--muted);line-height:1.7;font-style:italic}
.match-moment strong{color:var(--gold);font-style:normal}
.potm-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(212,168,75,.1);border:1px solid var(--gold-d);border-radius:5px;padding:3px 8px;font-size:.68rem;color:var(--gold)}
.mc-result{padding:8px 16px;text-align:right;font-size:.74rem;font-weight:700;letter-spacing:.3px}
.mc-result.win{background:rgba(34,160,60,.12);color:#4ade80}
.mc-result.loss{background:rgba(204,34,51,.1);color:var(--red-l)}

#fin-banner{display:none;background:linear-gradient(160deg,#0e0e1c,#14142a);border:1px solid var(--gold-d);border-radius:14px;padding:28px 22px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
#fin-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,162,39,.12),transparent 65%);pointer-events:none}
#fin-banner .fi{font-size:2.5rem;margin-bottom:6px}
#fin-banner .ft{font-size:1rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}
/* BIG RECORD */
#fin-banner .record{font-size:clamp(4rem,14vw,8rem);font-weight:900;line-height:1;letter-spacing:-4px;background:linear-gradient(160deg,var(--gold-bright),var(--gold),var(--gold-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 16px rgba(201,162,39,.5));margin-bottom:8px}
#fin-banner .record.perfect{animation:pulse-gold 1.8s ease-in-out infinite}
@keyframes pulse-gold{0%,100%{filter:drop-shadow(0 4px 16px rgba(201,162,39,.5))}50%{filter:drop-shadow(0 4px 32px rgba(245,215,110,.9))}}
#fin-banner .verdict{font-size:.9rem;font-weight:700;color:var(--cream);margin-bottom:12px;letter-spacing:.5px}
#fin-banner .fr{font-size:.74rem;color:var(--muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px}

#share-card{display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
#share-card .sh-title{font-size:.62rem;color:var(--faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-btn{padding:10px;font-size:.7rem;font-weight:600;border-radius:7px;cursor:pointer;text-transform:uppercase;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all .12s;letter-spacing:.3px}
.sh-btn:hover{border-color:var(--gold);color:var(--gold)}
.sh-btn.primary{background:var(--gold);color:#000;border-color:var(--gold)}
.sh-btn.primary:hover{background:var(--gold-d)}
#share-preview{margin-top:10px;display:none}
#share-preview img{width:100%;border-radius:8px;display:block}
#share-dl-row{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
canvas#sc{display:none}

#btn-back{background:transparent;color:var(--faint);border:1px solid var(--border);padding:9px;font-size:.7rem;border-radius:6px;cursor:pointer;width:100%;text-transform:uppercase;margin-top:8px;transition:all .12s}
#btn-back:hover{border-color:var(--muted);color:var(--muted)}

#missed-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--card);color:var(--gold);border:1px solid var(--border);padding:9px 18px;border-radius:30px;font-size:.74rem;letter-spacing:.3px;transition:transform .3s ease;z-index:999;white-space:nowrap;pointer-events:none;font-weight:600}
#missed-toast.show{transform:translateX(-50%) translateY(0)}

@keyframes reel-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.reel-in{animation:reel-in .22s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .18s ease}
</style>
</head>
<body>
<div id="missed-toast"></div>
<div id="app">
  <div id="hdr">

// ══════════════════════════════════════════════════════
function cntR(r){return team.filter(p=>p&&p.r===r).length;}
function fullR(r){return cntR(r)>=Q[r];}
function fullTeam(){return team.every(p=>p!==null);}
function avgV(){const f=team.filter(Boolean);return f.length?f.reduce((s,p)=>s+p.v,0)/f.length:0;}

function updateHeader(){
  const filled=team.filter(Boolean).length;
  document.getElementById("hdr-count").textContent=filled+"/11";
  document.getElementById("prog-fill").style.width=(filled/11*100)+"%";
}

function updateRoleTracker(){
  ["bat","ar","wk","bowl"].forEach(r=>{
    const n=cntR(r),q=Q[r];
    document.getElementById("rd-"+r).innerHTML=Array.from({length:q},(_,i)=>`<div class="dot${i<n?" on":""}"></div>`).join("");
    document.getElementById("rtc-"+r).textContent=n+" / "+q;
    document.getElementById("rtb-"+r).classList.toggle("full",n>=q);
  });
}

function updateSlots(){
  const list=document.getElementById("slots-list");
  list.innerHTML="";
  for(let i=0;i<11;i++){
    const p=team[i], div=document.createElement("div");
    if(p){
      const fit=positionFit(p.r,i+1);
      const fc=fitClass(fit);
      const dotCol=fc==="fit-good"?"#22a03c":fc==="fit-ok"?"#d08020":"#cc2233";
      div.className="slot filled";
      div.innerHTML=`<div class="slot-num">${i+1}</div>
        <div class="slot-name">${p.n}</div>
        <span class="role-tag ${p.r}">${RC[p.r]}</span>
        <span class="slot-era">${p.sq||""}</span>
        <span class="slot-v">${Math.round(p.v*10)}</span>
        <span class="fit-dot" style="background:${dotCol}" title="${fitLabel(fit)} position for ${RL[p.r]}"></span>`;
    } else if(sel){
      const fit=positionFit(sel.r,i+1);
      const fc=fitClass(fit);
      div.className=`slot empty slot-target ${fc}`;
      div.innerHTML=`<div class="slot-num">${i+1}</div><em>Bat at #${i+1}</em><span class="fit-label">${fitLabel(fit)}</span>`;
      div.addEventListener("click",()=>placePlayer(i));
    } else {
      div.className="slot empty";
      div.innerHTML=`<div class="slot-num">${i+1}</div><em>Empty</em>`;
    }
    list.appendChild(div);
  }
  // Strength bar — uses fit-weighted average once any player is placed
  const avg=avgV(), effAvg=effectiveAvgV();
  const pct=((effAvg-6)/4)*100;
  document.getElementById("str-val").textContent=avg?Math.round(effAvg*10)+"/100":"—";
  document.getElementById("str-bar").style.width=avg?Math.max(0,Math.min(100,pct))+"%":"0%";
}

function renderUI(){
  updateHeader();
  updateRoleTracker();
  updateSlots();
  document.getElementById("btn-sim").style.display=fullTeam()?"block":"none";
}
renderUI();

let spinning=false;

const FLAGS={Australia:"🇦🇺",India:"🇮🇳","West Indies":"🇼🇮",Pakistan:"🇵🇰","Sri Lanka":"🇱🇰",England:"🏴󠁧󠁢󠁥󠁮󠁧󠁿","New Zealand":"🇳🇿","South Africa":"🇿🇦","Bangladesh":"🇧🇩",Afghanistan:"🇦🇫"};
function flagFor(t){return FLAGS[t]||"🏏";}

function setReel(s,final=false){
  const reel=document.getElementById("reel");
  reel.style.opacity="0";
  setTimeout(()=>{
    reel.innerHTML=`<div class="yr">${s.y}</div>
      <div class="flag">${flagFor(s.t)}</div>
      <div class="tname">${s.t}</div>
      <div class="thost">${s.ev} · ${s.host}</div>`;
    reel.style.opacity="1";
    if(final){reel.classList.add("reel-in");setTimeout(()=>reel.classList.remove("reel-in"),300);}
  },70);
}

function doSpin(){
  if(spinning||fullTeam())return;
  spinning=true;
  document.getElementById("btn-spin").disabled=true;
  document.getElementById("btn-spin").textContent="🎰 Spin";
  document.getElementById("btn-spin-again").style.display="none";
  document.getElementById("respin-bar").style.display="none";
  document.getElementById("squad-panel").innerHTML=`<div class="sq-idle" style="opacity:.4">Spinning…</div>`;

  let ticks=0,total=Math.floor(Math.random()*10)+12;
  const iv=setInterval(()=>{
    ticks++;
    setReel(SQUADS[Math.floor(Math.random()*SQUADS.length)]);
    if(ticks>=total){
      clearInterval(iv);
      const chosen=SQUADS[Math.floor(Math.random()*SQUADS.length)];
      setTimeout(()=>{
        setReel(chosen,true);
        lastSquadDrawn=chosen;
        spinning=false;
        renderSquad(chosen);
        updateRespinUI();
      },200);
    }
  },110);
}

document.getElementById("btn-spin").addEventListener("click",doSpin);
document.getElementById("btn-spin-again").addEventListener("click",()=>{
  document.getElementById("btn-spin").disabled=false;
  doSpin();
});

function squadHint(){
  if(!sq) return;
  const el=document.querySelector(".squad-hint");
  if(!el) return;
  if(sel)
    el.textContent=`${sel.n} selected — click a batting position on the right`;
  else {
    const needed=["bat","ar","wk","bowl"].filter(r=>!fullR(r)).map(r=>RL[r]).join(", ");
    el.textContent=`Still need: ${needed} — click a player to select`;
  }
}

function renderSquad(s){
  sq=s; sel=null;
  const needed=["bat","ar","wk","bowl"].filter(r=>!fullR(r)).map(r=>RL[r]).join(", ");
  document.getElementById("squad-panel").innerHTML=`
    <div class="sq-head">
      <div class="sq-title">${s.t} <span style="color:var(--faint);font-weight:400">— ${s.y}</span></div>
      <div class="sq-sub">${s.ev} · ${s.host}</div>
    </div>
    <div class="squad-hint">Still need: ${needed} — click a player to select</div>
    <div class="sq-grid" id="sq-grid">
      ${s.p.map((p,i)=>{
        const tk=taken.has(p.n), qf=!tk&&fullR(p.r);
        return`<div class="pc ${tk?"taken":qf?"quota-full":"avail"}" data-i="${i}">
          <div class="pn">${p.n}</div>
          <span class="role-tag ${p.r}">${RC[p.r]}</span>
          <div class="prating">${Math.round(p.v*10)}</div>
          ${p.s?`<div class="pstat">${p.s}</div>`:""}
        </div>`;
      }).join("")}
    </div>`;

  document.querySelectorAll("#sq-grid .pc.avail").forEach(c=>{
    c.addEventListener("click",()=>selectPlayer(s.p[+c.dataset.i],c));
  });

  document.getElementById("btn-spin-again").style.display="none";
  document.getElementById("btn-spin").disabled=true;
  updateSlots();
}

function selectPlayer(p,card){
  if(taken.has(p.n)||fullR(p.r)||fullTeam())return;
  // toggle off if clicking already-selected player
  if(sel&&sel.n===p.n){
    sel=null;
    card.classList.remove("sel");
    updateSlots();
    squadHint();
    return;
  }
  sel={...p,sq:`${sq.t} '${String(sq.y).slice(-2)}`};
  document.querySelectorAll("#sq-grid .pc").forEach(c=>c.classList.remove("sel"));
  card.classList.add("sel");
  updateSlots();   // re-render slots as pick targets
  squadHint();
}

function placePlayer(position){
  if(!sel||team[position])return;
  const picked={...sel};
  team[position]=picked;
  taken.add(picked.n);

  // mark card taken, lock remaining avail cards
  document.querySelectorAll("#sq-grid .pc").forEach(c=>{
    const cp=sq.p[+c.dataset.i];
    if(cp&&cp.n===picked.n){c.classList.remove("avail","sel");c.classList.add("taken","pop");setTimeout(()=>c.classList.remove("pop"),200);}
    else if(c.classList.contains("avail")){c.classList.remove("avail");c.classList.add("quota-full");}
  });

  sel=null;
  if(lastSquadDrawn) setTimeout(()=>showMissedToast(picked,lastSquadDrawn),600);
  renderUI();

  if(fullTeam()){
    calcSquadGrade();
    document.getElementById("btn-spin").disabled=true;
    document.getElementById("respin-bar").style.display="none";
    document.querySelector(".squad-hint").textContent="XI complete — simulate your tournament!";
  } else {
    document.getElementById("btn-spin").disabled=false;
    document.getElementById("btn-spin").textContent="🎰 Spin Again";
    document.getElementById("respin-bar").style.display="none";
    document.querySelector(".squad-hint").textContent=`✓ ${picked.n} placed at #${position+1} — spin for the next squad`;
  }
}

function doRespin(candidates){
  if(reSpinsLeft<=0||!candidates.length)return;
  reSpinsLeft--;
  const chosen=candidates[Math.floor(Math.random()*candidates.length)];
  lastSquadDrawn=chosen;
  setReel(chosen,true);
  renderSquad(chosen);
  updateRespinUI();
}

//  SQUAD GRADE + MISSED TOAST
// ══════════════════════════════════════════════════════
function calcSquadGrade(){
  const avg=avgV(), eff=effectiveAvgV();
  const bat=team.filter(p=>p&&p.r==="bat").reduce((s,p)=>s+p.v*positionFit(p.r,team.indexOf(p)+1),0)/Q.bat;
  const ar=team.filter(p=>p&&p.r==="ar").reduce((s,p)=>s+p.v*positionFit(p.r,team.indexOf(p)+1),0)/Q.ar;
  const wkP=team.find(p=>p&&p.r==="wk"); const wk=wkP?wkP.v*positionFit("wk",team.indexOf(wkP)+1):0;
  const bowl=team.filter(p=>p&&p.r==="bowl").reduce((s,p)=>s+p.v*positionFit(p.r,team.indexOf(p)+1),0)/Q.bowl;
  const letter=eff>=9?"S":eff>=8.4?"A":eff>=7.8?"B":eff>=7.2?"C":"D";
  const tag=letter==="S"?"All-time legendary XI":letter==="A"?"Elite — formidable squad":letter==="B"?"Solid with match-winners":letter==="C"?"Respectably balanced":"Needs reinforcements";
  const penalty=Math.round((avg-eff)*10);
  const penStr=penalty>0?` <span style="color:var(--red-l);font-size:.7rem">-${penalty} positioning</span>`:"";
  const el=document.getElementById("squad-grade");
  el.style.display="block";
  el.innerHTML=`<div class="sg-row">
    <div><div class="sg-letter sg-${letter}">${letter}</div></div>
    <div style="text-align:right"><div class="sg-tag">${tag}</div><div class="sg-avg">Eff. ${Math.round(eff*10)} / 100${penStr}</div></div>
  </div>
  <div class="sg-break">🏏 Batting ${Math.round(bat*10)} &nbsp;·&nbsp; ⚡ All-rounders ${Math.round(ar*10)} &nbsp;·&nbsp; 🧤 Keeper ${Math.round(wk*10)} &nbsp;·&nbsp; 🎯 Bowling ${Math.round(bowl*10)}</div>`;
}

function showMissedToast(picked,squad){
  const missed=squad.p.filter(p=>p.r===picked.r&&p.n!==picked.n&&!taken.has(p.n)).sort((a,b)=>b.v-a.v)[0];
  if(!missed||missed.v<=picked.v)return;
  const t=document.getElementById("missed-toast");
  t.textContent=`You could've had ${missed.n} (${Math.round(missed.v*10)}) instead`;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3200);
}

// ══════════════════════════════════════════════════════
//  SIMULATION
// ══════════════════════════════════════════════════════
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

// Natural batting ranges per role (1-indexed positions)
const ROLE_RANGE={bat:[1,6],ar:[5,8],wk:[4,7],bowl:[8,11]};
function positionFit(role,pos){
  const [lo,hi]=ROLE_RANGE[role]||[1,11];
  if(pos>=lo&&pos<=hi)return 1.0;
  const dist=pos<lo?lo-pos:pos-hi;
  return Math.max(0.45,1.0-dist*0.13);
}
function fitClass(fit){return fit>=0.93?"fit-good":fit>=0.74?"fit-ok":"fit-bad";}
function fitLabel(fit){return fit>=0.93?"IDEAL":fit>=0.74?"OK":"RISKY";}

function effectiveAvgV(){
  const vals=team.map((p,i)=>p?p.v*positionFit(p.r,i+1):null).filter(v=>v!==null);
  return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
}

function simBatter(player,position,oppBowl){
  const pf=position<=2?1.0:position<=4?.82:position<=6?.58:position<=8?.32:.15;
  if(Math.random()<.07+(position-1)*.025)return{runs:0,balls:1,out:true};
  const fit=positionFit(player.r,position);
  const cap=player.bat*1.6*pf*fit;
  const raw=Math.round(cap*Math.pow(Math.random(),.65));
  const adj=Math.max(0,Math.round(raw*(1-(oppBowl-65)/280)));
  const sr=72+Math.random()*62;
  return{runs:Math.min(adj,185),balls:Math.max(1,Math.round(adj/sr*100)),out:Math.random()<.84};
}

function simBowler(player,oppBat){
  const overs=rand(8,10),balls=overs*6;
  const wkC=(player.bowl/(player.bowl+oppBat))*.13;
  let w=0;for(let b=0;b<balls;b++)if(Math.random()<wkC)w++;
  return{overs,wickets:Math.min(w,5),runs:Math.round((4.2+Math.random()*4.8)*overs)};
}

function genOppSc(names,total){
  let rem=total,out=[];
  names.slice(0,8).forEach((name,i)=>{
    if(rem<=0){out.push({name,runs:0,balls:rand(0,8)});return;}
    const share=i<2?rand(15,65):i<5?rand(5,40):rand(0,22);
    const runs=Math.min(share,rem); rem-=runs;
    out.push({name,runs:Math.max(0,runs),balls:rand(runs,runs+28)});
  });
  return out;
}

function simulateMatch(fixture){
  const os=fixture.oppStr;
  const batOrder=team.filter(Boolean);

  let total=0,wk=0,extras=rand(5,18);
  const sc=batOrder.map((p,i)=>{
    if(wk>=9)return{...p,runs:0,balls:0,out:false,dnb:true};
    const r=simBatter(p,i+1,os*.95);
    total+=r.runs; if(r.out)wk++;
    return{...p,...r,dnb:false};
  });
  total=Math.max(total+extras,90);

  const bowlers=[...team.filter(p=>p&&p.r==="bowl"),...team.filter(p=>p&&p.r==="ar")];
  const bowling=bowlers.map(p=>({...p,...simBowler(p,os)}));

  const winP=Math.max(.15,Math.min(.83,.5+(effectiveAvgV()-os/10)/3*.35));
  const won=Math.random()<winP;
  let oppTotal=Math.round(os*2.1+rand(-20,30));
  if(won&&oppTotal>=total)oppTotal=total-rand(8,48);
  if(!won&&oppTotal<=total)oppTotal=total+rand(8,42);
  oppTotal=Math.max(oppTotal,88);
  const oppWk=rand(5,10);
  const oppNames=OPP_PLAYERS[fixture.opp]||Array.from({length:8},(_,i)=>`Player ${i+1}`);
  const oppSc=genOppSc(oppNames,oppTotal-rand(5,15));

  let wLeft=oppWk;
  bowling.forEach((b,i)=>{const share=i===bowling.length-1?wLeft:Math.min(rand(0,3),wLeft);b.wickets=Math.min(b.wickets,share);wLeft=Math.max(0,wLeft-b.wickets);});

  return{fixture,won,margin:won?`Won by ${rand(1,8)} wickets`:`Lost by ${rand(8,52)} runs`,yourTotal:total,yourWickets:wk,extras,scorecard:sc,bowling,oppTotal,oppWickets:oppWk,oppScorecard:oppSc};
}

document.getElementById("btn-sim").addEventListener("click",()=>{
  document.getElementById("draft-phase").classList.remove("active");
  document.getElementById("sim-phase").classList.add("active");

  // Team strip
  document.getElementById("team-strip").innerHTML=team.filter(Boolean).map((p,i)=>`
    <div class="tc_ ${p.r}">
      <div class="tn">${p.n}</div>
      <div class="ts">${p.sq||""}</div>
      <div class="tv" style="color:${ROLE_COLOR[p.r]}">${p.v}</div>
    </div>`).join("");

  // Run simulation
  results=[]; currentMatch=0;
  let knocked=false;
  for(let i=0;i<FIXTURES.length;i++){
    if(knocked)break;
    const r=simulateMatch(FIXTURES[i]);
    results.push(r);
    if(!r.won&&r.fixture.stage!=="Group Stage")knocked=true;
  }

  // Summary stats
  const wins=results.filter(r=>r.won).length;
  const avgR=Math.round(results.reduce((a,r)=>a+r.yourTotal,0)/results.length);
  const tw=results.reduce((a,r)=>a+r.bowling.reduce((b,bw)=>b+bw.wickets,0),0);
  document.getElementById("smry").innerHTML=`
    <div class="sc_"><div class="sv">${results.length}</div><div class="sl">Played</div></div>
    <div class="sc_"><div class="sv">${wins}</div><div class="sl">Won</div></div>
    <div class="sc_"><div class="sv">${avgR}</div><div class="sl">Avg Score</div></div>
    <div class="sc_"><div class="sv">${tw}</div><div class="sl">Wkts Taken</div></div>`;

  // Final banner
  const last=results[results.length-1];
  const champion=wins===results.length&&last.fixture.stage==="Final"&&last.won;
  const runMap={},wktMap={};
  team.filter(Boolean).forEach(p=>{runMap[p.n]=0;wktMap[p.n]=0;});
  results.forEach(m=>{
    m.scorecard.filter(b=>!b.dnb).forEach(b=>{runMap[b.n]=(runMap[b.n]||0)+b.runs;});
    m.bowling.forEach(b=>{wktMap[b.n]=(wktMap[b.n]||0)+b.wickets;});
  });
  const topBat=Object.entries(runMap).sort((a,b)=>b[1]-a[1])[0];
  const topBowl=Object.entries(wktMap).sort((a,b)=>b[1]-a[1])[0];
  const stats={topBat,topBowl};
  const fin=document.getElementById("fin-banner");
  const losses=results.length-wins;
  const recordStr=`${wins}-${losses}`;
  const isPerfect=champion&&wins===7;
  if(champion)
    fin.innerHTML=`<div class="fi">🏆</div><div class="ft">World Cup Champions</div>
      <div class="record${isPerfect?" perfect":""}">${recordStr}</div>
      <div class="verdict">${isPerfect?"Unbeaten. The perfect run.":"All seven. Absolute legends."}</div>
      <div class="fr">🏏 ${topBat?.[0]} · ${topBat?.[1]} runs &nbsp;·&nbsp; 🎯 ${topBowl?.[0]} · ${topBowl?.[1]} wkts</div>`;
  else if(!last.won&&last.fixture.stage!=="Group Stage")
    fin.innerHTML=`<div class="fi">💔</div><div class="ft">Knocked Out — ${last.fixture.stage}</div>
      <div class="record" style="-webkit-text-fill-color:var(--muted);filter:none">${recordStr}</div>
      <div class="verdict">Beaten by ${last.fixture.opp} at ${last.fixture.venue}.</div>
      <div class="fr">🏏 ${topBat?.[0]} · ${topBat?.[1]} runs &nbsp;·&nbsp; 🎯 ${topBowl?.[0]} · ${topBowl?.[1]} wkts</div>`;
  else
    fin.innerHTML=`<div class="fi">🥈</div><div class="ft">Runners-Up</div>
      <div class="record">${recordStr}</div>
      <div class="verdict">Made the Final — couldn't close it out.</div>
      <div class="fr">🏏 ${topBat?.[0]} · ${topBat?.[1]} runs &nbsp;·&nbsp; 🎯 ${topBowl?.[0]} · ${topBowl?.[1]} wkts</div>`;
  fin.style.display="block";

  document.getElementById("share-card").style.display="none";
  // store for share
  window._tournStats=stats;
  showMatch(0);
});

// ══════════════════════════════════════════════════════
//  MATCH MOMENTS
// ══════════════════════════════════════════════════════
const MOMENTS_W=[(b,bw)=>`<strong>${b.n}</strong> produces a masterclass — ${b.runs} off ${b.balls} balls leaves the crowd stunned.`,(b,bw)=>`<strong>${bw.n}</strong> rips through the top order. ${bw.wickets} wickets in a devastating spell.`,(b,bw)=>`Trailing at the drinks break, <strong>${b.n}</strong> digs in and turns the game on its head.`,(b,bw)=>`A yorker of outrageous quality from <strong>${bw.n}</strong> seals it in the final over.`,(b,bw)=>`<strong>${b.n}</strong>'s measured innings gives the XI the platform they desperately needed.`];
const MOMENTS_L=[(b,bw)=>`A poor start with the bat sets the tone. <strong>${b.n}</strong> can't rescue the innings alone.`,(b,bw)=>`<strong>${bw.n}</strong> is expensive — the target proves well out of reach.`,(b,bw)=>`They needed 60 off 4 overs. The innings collapses. The dressing room is silent.`,(b,bw)=>`A crucial dropped catch changes the game — the opposition capitalise ruthlessly.`,(b,bw)=>`<strong>${b.n}</strong> fights hard but the lower order can't hold on.`];
function matchMoment(m){
  const b=m.scorecard.filter(x=>!x.dnb).sort((a,c)=>c.runs-a.runs)[0]||{n:"No.11",runs:0,balls:0};
  const bw=[...m.bowling].sort((a,c)=>c.wickets-a.wickets)[0]||{n:"No-one",wickets:0};
  const pool=m.won?MOMENTS_W:MOMENTS_L;
  return pool[Math.floor(Math.random()*pool.length)](b,bw);
}

// ══════════════════════════════════════════════════════
//  SHOW MATCH
// ══════════════════════════════════════════════════════
function renderMomentum(idx){
  const el=document.getElementById("mo-dots");
  el.innerHTML=FIXTURES.map((_,i)=>{
    const r=results[i];
    if(!r)return`<div class="mo-dot ahead" title="${FIXTURES[i].stage}"></div>`;
    return`<div class="mo-dot ${r.won?"W":"L"}" title="${r.won?"Won":"Lost"} vs ${r.fixture.opp}"></div>`;
  }).join("");
  document.getElementById("momentum").style.display="block";
}

function showMatch(idx){
  currentMatch=idx;
  const m=results[idx];
  const total=results.length;
  renderMomentum(idx);

  document.getElementById("nav-prev").disabled=idx===0;
  const isLast=idx===total-1;
  const nb=document.getElementById("nav-next");
  nb.textContent=isLast?"View Summary →":"Next →";
  nb.className=isLast?"primary":"";
  nb.disabled=false;
  document.getElementById("nav-step").textContent=`Match ${idx+1} of ${total}`;

  const topBat=m.scorecard.filter(b=>!b.dnb).sort((a,b)=>b.runs-a.runs).slice(0,5);
  const bowlSort=[...m.bowling].sort((a,b)=>b.wickets-a.wickets||a.runs-b.runs).slice(0,5);
  const topOpp=[...m.oppScorecard].sort((a,b)=>b.runs-a.runs).slice(0,3);
  const potm=topBat[0]?.runs>=40?topBat[0]:bowlSort[0]?.wickets>=3?bowlSort[0]:topBat[0]||bowlSort[0];
  const potmStat=potm?.balls!=null&&potm.balls>0&&potm.runs!=null?`${potm.runs} runs (${potm.balls}b)`:`${potm?.wickets||0}/${potm?.runs||0}`;

  document.getElementById("match-display").innerHTML=`
    <div class="mc">
      <div class="mc-head">
        <div><div class="mt">World XI vs ${m.fixture.opp}</div><div style="font-size:.65rem;color:rgba(255,255,255,.45);margin-top:3px">${m.fixture.venue}</div></div>
        <div class="ms">${m.fixture.stage}</div>
      </div>
      <div class="mc-scores">
        <div class="ms-team"><div class="ms-r">${m.yourTotal}/${m.yourWickets}</div><div class="ms-l">Your XI</div></div>
        <div class="ms-vs">vs</div>
        <div class="ms-team"><div class="ms-r" style="color:${m.won?"#7aab6a":"#e87070"}">${m.oppTotal}/${m.oppWickets}</div><div class="ms-l">${m.fixture.opp}</div></div>
      </div>
      <div class="mc-body">
        <div class="mc-sec">
          <div class="mc-sec-title">Your Batting</div>
          <table class="sc-tbl">
            <tr><th>Batter</th><th>R</th><th>B</th><th>SR</th><th></th></tr>
            ${topBat.map(b=>{
              const sr=b.balls>0?((b.runs/b.balls)*100).toFixed(0):"—";
              const icon=b.runs>=100?"💯":b.runs>=50?"⭐":b.runs===0?"🦆":"";
              return`<tr class="${b.runs>=50?"hi":""}"><td>${b.n}</td><td class="bold">${b.runs}</td><td>${b.balls}</td><td>${sr}</td><td>${icon}</td></tr>`;
            }).join("")}
          </table>
          <div class="mc-total">Extras ${m.extras} · Total <strong>${m.yourTotal}/${m.yourWickets}</strong></div>
        </div>
        <div class="mc-sec">
          <div class="mc-sec-title">Your Bowling</div>
          <table class="sc-tbl">
            <tr><th>Bowler</th><th>O</th><th>W</th><th>R</th><th>Econ</th></tr>
            ${bowlSort.map(b=>{
              const econ=(b.runs/b.overs).toFixed(1);
              const badge=b.wickets>=5?"🌟":b.wickets>=3?"🔥":"";
              return`<tr class="${b.wickets>=3?"hi-bowl":""}"><td>${b.n} ${badge}</td><td>${b.overs}</td><td class="bold">${b.wickets}</td><td>${b.runs}</td><td class="${+econ<6?"good":+econ>8?"bad":""}">${econ}</td></tr>`;
            }).join("")}
          </table>
        </div>
        <div class="mc-sec">
          <div class="mc-sec-title">${m.fixture.opp} — Top Scores</div>
          <table class="sc-tbl">
            <tr><th>Batter</th><th>R</th><th>B</th></tr>
            ${topOpp.map(b=>`<tr><td>${b.name}</td><td class="bold">${b.runs}</td><td>${b.balls}</td></tr>`).join("")}
          </table>
          <div class="mc-total">Total <strong>${m.oppTotal}/${m.oppWickets}</strong></div>
        </div>
        <div class="match-moment">${matchMoment(m)}</div>
        ${potm?`<div class="potm-badge">⭐ Player of the Match &nbsp;<strong>${potm.n}</strong>&nbsp; ${potmStat}</div>`:""}
      </div>
      <div class="mc-result ${m.won?"win":"loss"}">${m.margin}</div>
    </div>`;

  window.scrollTo({top:document.getElementById("match-display").offsetTop-16,behavior:"smooth"});
}

document.getElementById("nav-prev").addEventListener("click",()=>{if(currentMatch>0)showMatch(currentMatch-1);});
document.getElementById("nav-next").addEventListener("click",()=>{
  if(currentMatch<results.length-1)showMatch(currentMatch+1);
  else{
    document.getElementById("match-display").innerHTML="";
    document.getElementById("nav-prev").disabled=true;
    document.getElementById("nav-next").disabled=true;
    document.getElementById("nav-step").textContent="Tournament complete";
    document.getElementById("share-card").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

// ══════════════════════════════════════════════════════
//  SHARE CARD
// ══════════════════════════════════════════════════════
document.getElementById("btn-gen").addEventListener("click",generateShareCard);

function generateShareCard(){
  const W=560,H=900,canvas=document.getElementById("sc");
  canvas.width=W*2; canvas.height=H*2; // retina
  const ctx=canvas.getContext("2d");
  ctx.scale(2,2);

  const wins=results.filter(r=>r.won).length;
  const losses=results.length-wins;
  const last=results[results.length-1];
  const champion=wins===results.length&&last.won&&last.fixture.stage==="Final";
  const stats=window._tournStats||{topBat:["—",0],topBowl:["—",0]};

  // ── Background ──────────────────────────────────────
  ctx.fillStyle="#07070f";
  ctx.fillRect(0,0,W,H);

  // subtle grid lines
  ctx.strokeStyle="rgba(255,255,255,.025)"; ctx.lineWidth=1;
  for(let y=0;y<H;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // top gold bar
  const gbar=ctx.createLinearGradient(0,0,W,0);
  gbar.addColorStop(0,"#6a520a"); gbar.addColorStop(.4,"#c9a227"); gbar.addColorStop(.6,"#e8c84a"); gbar.addColorStop(1,"#6a520a");
  ctx.fillStyle=gbar; ctx.fillRect(0,0,W,4);

  // ── Header: 7-0 branding ────────────────────────────
  ctx.textAlign="center";
  ctx.fillStyle="#c9a227"; ctx.font="700 11px system-ui";
  ctx.fillText("7-0  ·  WORLD CUP DRAFT",W/2,26);

  // ── BIG RECORD ──────────────────────────────────────
  const recY=90;
  const recGrad=ctx.createLinearGradient(W/2-80,recY-70,W/2+80,recY+10);
  recGrad.addColorStop(0,"#f5d76e"); recGrad.addColorStop(.5,"#c9a227"); recGrad.addColorStop(1,"#8a6a0a");
  ctx.fillStyle=recGrad;
  ctx.font="900 80px system-ui";
  ctx.fillText(`${wins}-${losses}`,W/2,recY);

  // verdict label
  const verdictColor=champion?"#4ade80":!last.won&&last.fixture.stage!=="Group Stage"?"#f05060":"#c9a227";
  ctx.fillStyle=verdictColor; ctx.font="700 13px system-ui";
  const verdict=champion?"WORLD CUP CHAMPIONS 🏆":!last.won&&last.fixture.stage!=="Group Stage"?`KNOCKED OUT — ${last.fixture.stage.toUpperCase()}`:"RUNNERS-UP 🥈";
  ctx.fillText(verdict,W/2,112);

  // divider
  const dv=ctx.createLinearGradient(40,0,W-40,0);
  dv.addColorStop(0,"transparent"); dv.addColorStop(.5,"#c9a22788"); dv.addColorStop(1,"transparent");
  ctx.strokeStyle=dv; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(40,126); ctx.lineTo(W-40,126); ctx.stroke();

  // ── Player list ─────────────────────────────────────
  const rc={bat:"#5ba8f0",ar:"#e08838",wk:"#a060e0",bowl:"#38c878"};
  const ord=team.filter(Boolean);
  const sy=136, rh=68;

  ord.forEach((p,i)=>{
    const y=sy+i*rh;
    // row bg
    ctx.fillStyle=i%2===0?"rgba(255,255,255,.03)":"rgba(0,0,0,.0)";
    ctx.fillRect(0,y,W,rh);

    // position number
    ctx.fillStyle="#c9a22799"; ctx.font="600 11px system-ui"; ctx.textAlign="left";
    ctx.fillText(String(i+1).padStart(2,"0"),16,y+26);

    // role pill
    const c2=rc[p.r]||"#aaa";
    ctx.fillStyle=c2+"28";
    ctx.beginPath(); ctx.roundRect(40,y+13,34,17,4); ctx.fill();
    ctx.fillStyle=c2; ctx.font="700 9px system-ui"; ctx.textAlign="center";
    ctx.fillText(RC[p.r],57,y+25);

    // name
    ctx.fillStyle="#f0ead8"; ctx.font=`${p.v>=9?"700":"500"} 14px system-ui`; ctx.textAlign="left";
    ctx.fillText(p.n,84,y+24);

    // era label
    ctx.fillStyle="rgba(255,255,255,.32)"; ctx.font="11px system-ui";
    ctx.fillText(p.sq||"",84,y+41);

    // rating badge
    const rating=Math.round(p.v*10);
    const rColor=rating>=90?"#f5d76e":rating>=80?"#c9a227":"#8a7060";
    ctx.fillStyle=rColor+"22"; ctx.beginPath(); ctx.roundRect(W-56,y+12,42,20,10); ctx.fill();
    ctx.fillStyle=rColor; ctx.font="700 13px system-ui"; ctx.textAlign="center";
    ctx.fillText(rating,W-35,y+26);
  });

  // ── Footer stats ────────────────────────────────────
  const fY=sy+ord.length*rh+6;
  ctx.strokeStyle=dv; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(40,fY); ctx.lineTo(W-40,fY); ctx.stroke();

  ctx.fillStyle="#c9a227"; ctx.font="600 9px system-ui"; ctx.textAlign="left";
  ctx.fillText("TOP SCORER",16,fY+18);
  ctx.fillStyle="#f0ead8"; ctx.font="700 12px system-ui";
  ctx.fillText(`${stats.topBat?.[0]||"—"}  ·  ${stats.topBat?.[1]||0} runs`,16,fY+33);

  ctx.fillStyle="#c9a227"; ctx.font="600 9px system-ui"; ctx.textAlign="right";
  ctx.fillText("TOP BOWLER",W-16,fY+18);
  ctx.fillStyle="#f0ead8"; ctx.font="700 12px system-ui";
  ctx.fillText(`${stats.topBowl?.[0]||"—"}  ·  ${stats.topBowl?.[1]||0} wkts`,W-16,fY+33);

  // bottom gold bar
  ctx.fillStyle=gbar; ctx.fillRect(0,H-4,W,4);

  // ── Export ───────────────────────────────────────────
  const url=canvas.toDataURL("image/png");
  document.getElementById("share-img").src=url;
  document.getElementById("share-preview").style.display="block";

  document.getElementById("btn-dl").onclick=()=>{
    const a=document.createElement("a");
    a.download="7-0-world-cup-xi.png"; a.href=url; a.click();
  };
  document.getElementById("btn-share").onclick=async()=>{
    if(navigator.share&&navigator.canShare){
      try{
        const blob=await(await fetch(url)).blob();
        const file=new File([blob],"7-0-xi.png",{type:"image/png"});
        if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`7-0 World Cup Draft — ${wins}-${losses}`});return;}
      }catch(e){}
    }
    copyText();
  };
}

document.getElementById("btn-copy").addEventListener("click",copyText);
function copyText(){
  const wins=results.filter(r=>r.won).length;
  const s=window._tournStats||{};
  const lines=["🏏 World Cup XI Dream Team",`Record: ${wins}–${results.length-wins}`,"",...team.map((p,i)=>p?`${i+1}. ${p.n} (${RL[p.r]}) — ${p.sq||""} [${Math.round(p.v*10)}]`:null).filter(Boolean),`\n🏏 Top scorer: ${s.topBat?.[0]} ${s.topBat?.[1]} runs`,`🎯 Top bowler: ${s.topBowl?.[0]} ${s.topBowl?.[1]} wkts`];
  navigator.clipboard?.writeText(lines.join("\n")).then(()=>alert("Copied!")).catch(()=>alert("Copy not supported"));
}

// ══════════════════════════════════════════════════════
//  BACK / RESET
// ══════════════════════════════════════════════════════
document.getElementById("btn-back").addEventListener("click",()=>{
  team=new Array(11).fill(null); taken=new Set(); sq=null; sel=null;
  spinning=false; reSpinsLeft=3; lastSquadDrawn=null;
  document.getElementById("reel").innerHTML=`<div class="idle">Press Spin to reveal a squad</div>`;
  document.getElementById("reel").style.opacity="1";
  document.getElementById("squad-panel").innerHTML=`<div class="sq-idle">Hit <strong>Spin</strong> to reveal a random World Cup squad.<br>Click any available player to draft them directly.</div>`;
  document.getElementById("respin-bar").style.display="none";
  document.getElementById("squad-grade").style.display="none";
  document.getElementById("btn-spin").disabled=false;
  document.getElementById("btn-spin").textContent="🎰 Spin";
  document.getElementById("btn-spin-again").style.display="none";
  renderUI();
  document.getElementById("sim-phase").classList.remove("active");
  document.getElementById("draft-phase").classList.add("active");
});
</script>
