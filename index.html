<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket XI — Build Your Dream World Cup Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #1a7a3c;
    --green-dark: #135a2c;
    --green-light: #2ecc71;
    --cream: #f5f0e8;
    --gold: #f0b429;
    --gold-dark: #c8941e;
    --red: #e74c3c;
    --blue: #2980b9;
    --text: #1a1a1a;
    --text-light: #555;
    --card-bg: #fff;
    --border: #ddd;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #fff;
    text-align: center;
    padding: 20px 16px 16px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
  }
  header h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  header p { font-size: .9rem; opacity: .85; margin-top: 4px; }

  /* ── PROGRESS BAR ── */
  #progress-bar {
    background: rgba(0,0,0,.2);
    height: 6px;
  }
  #progress-fill {
    height: 6px;
    background: var(--gold);
    transition: width .5s ease;
    width: 0%;
  }

  /* ── MAIN LAYOUT ── */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
  }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
  }

  /* ── PANEL CARDS ── */
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    font-weight: 700;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .5px;
    background: #f7f7f7;
    border-bottom: 1px solid var(--border);
    color: var(--text-light);
  }

  /* ── SPIN ZONE ── */
  #spin-zone {
    text-align: center;
    padding: 20px 16px;
  }
  #spin-info {
    font-size: .85rem;
    color: var(--text-light);
    margin-bottom: 12px;
  }
  #spin-info strong { color: var(--green-dark); }

  /* reel */
  #reel-wrapper {
    background: var(--green-dark);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #reel {
    text-align: center;
    color: #fff;
    transition: opacity .15s;
  }
  #reel .year-badge {
    display: inline-block;
    background: var(--gold);
    color: #000;
    font-weight: 800;
    font-size: 1rem;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 4px;
  }
  #reel .team-name {
    font-size: 1.5rem;
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #reel .team-flag { font-size: 2.2rem; }
  #reel .host-label { font-size: .75rem; opacity: .7; margin-top: 2px; }

  /* spin button */
  #btn-spin {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #000;
    border: none;
    border-radius: 40px;
    padding: 14px 40px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(240,180,41,.4);
    transition: transform .1s, box-shadow .1s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #btn-spin:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,180,41,.5); }
  #btn-spin:active { transform: translateY(0); }
  #btn-spin:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ── SQUAD GRID ── */
  #squad-section { margin-top: 16px; }
  #squad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    padding: 14px;
  }

  .player-card {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: border-color .15s, transform .15s, box-shadow .15s;
    background: #fff;
    position: relative;
  }
  .player-card:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(26,122,60,.2);
  }
  .player-card .player-name {
    font-weight: 700;
    font-size: .85rem;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .player-card .player-role {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .role-BAT { background: #e8f5e9; color: #2e7d32; }
  .role-BWL { background: #fce4ec; color: #c62828; }
  .role-ALL { background: #fff3e0; color: #e65100; }
  .role-WK  { background: #e3f2fd; color: #1565c0; }

  .player-card .rating-bar-wrap {
    height: 5px;
    background: #eee;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .player-card .rating-bar {
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--green-light), var(--green-dark));
  }
  .player-card .rating-num {
    font-size: .7rem;
    color: var(--text-light);
    margin-top: 3px;
    text-align: right;
  }

  .player-card.selected-already {
    opacity: .4;
    pointer-events: none;
  }

  /* ── TEAM PANEL ── */
  #team-panel { position: sticky; top: 16px; }

  #slots-list { padding: 10px; }
  .slot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: #f9f9f9;
    border: 1px solid #eee;
    font-size: .82rem;
    min-height: 40px;
  }
  .slot.empty { color: #bbb; font-style: italic; }
  .slot .slot-num {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--green-dark);
    color: #fff;
    font-size: .65rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .slot.empty .slot-num { background: #ccc; }
  .slot .slot-name { font-weight: 600; flex: 1; }
  .slot .slot-role {
    font-size: .65rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .slot .slot-era { font-size: .65rem; color: var(--text-light); }
  .slot .slot-rating { font-size: .7rem; font-weight: 700; color: var(--green-dark); }

  #team-strength {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .strength-bar-wrap { margin-top: 4px; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  .strength-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green-light), var(--green-dark)); transition: width .5s; }
  .strength-label { font-size: .78rem; color: var(--text-light); margin-top: 4px; display: flex; justify-content: space-between; }

  /* ── SIMULATE BUTTON ── */
  #btn-simulate {
    display: block;
    width: calc(100% - 20px);
    margin: 10px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .5px;
    transition: opacity .2s;
  }
  #btn-simulate:disabled { opacity: .3; cursor: not-allowed; }
  #btn-simulate:not(:disabled):hover { opacity: .9; }

  /* ── RESULTS SCREEN ── */
  #results-screen {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
  }

  .result-header {
    text-align: center;
    padding: 24px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #fff;
  }
  .result-header h2 { font-size: 1.8rem; }
  .result-header .trophy { font-size: 4rem; display: block; margin-bottom: 8px; }
  .result-header .record { font-size: 2.5rem; font-weight: 900; color: var(--gold); }
  .result-header .verdict { font-size: 1rem; opacity: .9; margin-top: 4px; }

  .matches-list { display: grid; gap: 8px; }
  .match-row {
    background: #fff;
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .match-row .stage { font-size: .72rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); width: 70px; }
  .match-row .opponent { font-weight: 600; font-size: .88rem; flex: 1; }
  .match-row .scores { font-size: .82rem; color: var(--text-light); text-align: right; }
  .match-row .outcome {
    font-weight: 800;
    font-size: .78rem;
    padding: 3px 8px;
    border-radius: 4px;
    min-width: 40px;
    text-align: center;
  }
  .outcome-W { background: #e8f5e9; color: #2e7d32; }
  .outcome-L { background: #fce4ec; color: #c62828; }
  .outcome-NR { background: #f3f4f6; color: #555; }

  .mvp-card {
    background: linear-gradient(135deg, #fff8e1, #fff3cd);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-top: 12px;
  }
  .mvp-card h3 { font-size: .8rem; text-transform: uppercase; color: var(--text-light); letter-spacing: .5px; margin-bottom: 6px; }
  .mvp-card .mvp-name { font-size: 1.3rem; font-weight: 800; }
  .mvp-card .mvp-stat { font-size: .82rem; color: var(--text-light); margin-top: 4px; }

  #btn-restart {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* ── SPINNING ANIMATION ── */
  @keyframes spin-blur {
    0%   { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .reel-enter { animation: spin-blur .3s ease; }

  /* ── NOTIFICATION ── */
  #notif {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #333;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: .88rem;
    font-weight: 600;
    transition: transform .3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  #notif.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

        <button id="btn-simulate" disabled>Simulate Tournament →</button>

</div>

<!-- RESULTS -->
<div id="results-screen"></div>

// ══════════════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════════════

const MAX_PICKS = 10;
const SLOT_ROLES = ['BAT','BAT','BAT','BAT','WK','ALL','ALL','BWL','BWL','BWL'];
const SLOT_LABELS = {
  BAT: '🏏 Batsman',
  WK:  '🧤 Wicketkeeper',
  ALL: '⚡ All-rounder',
  BWL: '🎯 Bowler',
};

let state = {
  picks: 0,
  team: [],        // selected players
  pickedIds: new Set(),  // "year-team-name"
  currentSquad: null,
  spinning: false,
  spinDone: false,
};

// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function teamStrength(team) {
  if (!team.length) return 0;
  return Math.round(team.reduce((s, p) => s + p.rating, 0) / team.length);
}

function notify(msg, ms = 2000) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ══════════════════════════════════════════════════════
//  RENDER TEAM SLOTS
// ══════════════════════════════════════════════════════

function renderSlots() {
  const list = document.getElementById('slots-list');
  list.innerHTML = '';
  for (let i = 0; i < MAX_PICKS; i++) {
    const p = state.team[i];
    const div = document.createElement('div');
    if (p) {
      div.className = 'slot';
      div.innerHTML = `
        <div class="slot-num">${i + 1}</div>
        <div class="slot-name">${p.name}</div>
        <div class="slot-role role-${p.role}">${p.role}</div>
        <div class="slot-era">${p.year}</div>
        <div class="slot-rating">${p.rating}</div>`;
    } else {
      div.className = 'slot empty';
      div.innerHTML = `<div class="slot-num">${i + 1}</div><em>Empty</em>`;
    }
    list.appendChild(div);
  }

  // Strength
  const str = teamStrength(state.team);
  document.getElementById('strength-val').textContent = str;
  document.getElementById('strength-bar').style.width = str + '%';

  // Progress
  const pct = (state.picks / MAX_PICKS) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  const roleNeeded = state.picks < MAX_PICKS ? ` — ${SLOT_LABELS[SLOT_ROLES[state.picks]]}` : '';
  document.getElementById('pick-counter').textContent = `Pick ${Math.min(state.picks + 1, MAX_PICKS)} of ${MAX_PICKS}${roleNeeded}`;

  // Simulate button
  const btn = document.getElementById('btn-simulate');
  btn.disabled = state.team.length < MAX_PICKS;
}

// ══════════════════════════════════════════════════════
//  RENDER SQUAD
// ══════════════════════════════════════════════════════

function currentNeededRole() {
  return SLOT_ROLES[state.picks];
}

function renderSquad(squad) {
  const grid = document.getElementById('squad-grid');
  const title = document.getElementById('squad-title');
  const role = currentNeededRole();
  title.textContent = `${squad.flag} ${squad.team} — ${squad.year} World Cup · Pick a ${SLOT_LABELS[role]}`;

  // Filter to only players matching the needed role
  const eligible = squad.players.filter(p => p.role === role);

  grid.innerHTML = '';

  if (eligible.length === 0) {
    grid.innerHTML = `<div style="padding:16px;color:#888;font-size:.88rem;">No ${role} in this squad — spin again for a different team.</div>`;
    document.getElementById('btn-spin').disabled = false;
    state.spinDone = false;
    document.getElementById('squad-section').style.display = '';
    return;
  }

  eligible.forEach(p => {
    const id = `${squad.year}-${squad.team}-${p.name}`;
    const alreadyPicked = state.pickedIds.has(id);
    const card = document.createElement('div');
    card.className = 'player-card' + (alreadyPicked ? ' selected-already' : '');
    card.innerHTML = `
      <div class="player-name">${p.name}</div>
      <div class="player-role role-${p.role}">${p.role}</div>
      <div style="font-size:.72rem;color:#888;margin-bottom:2px;">${squad.year} era</div>
      <div class="rating-bar-wrap"><div class="rating-bar" style="width:${p.rating}%"></div></div>
      <div class="rating-num">Rating: ${p.rating}</div>`;
    if (!alreadyPicked) {
      card.addEventListener('click', () => selectPlayer(p, squad, id));
    }
    grid.appendChild(card);
  });

  document.getElementById('squad-section').style.display = '';
}

// ══════════════════════════════════════════════════════
//  SELECT PLAYER
// ══════════════════════════════════════════════════════

function selectPlayer(p, squad, id) {
  if (state.picks >= MAX_PICKS) return;
  const player = { ...p, year: squad.year, team: squad.team, flag: squad.flag };
  state.team.push(player);
  state.pickedIds.add(id);
  state.picks++;
  state.spinDone = false;

  renderSlots();
  document.getElementById('squad-section').style.display = 'none';
  const nextRole = state.picks < MAX_PICKS ? SLOT_LABELS[SLOT_ROLES[state.picks]] : null;
  document.getElementById('spin-info').innerHTML = state.picks < MAX_PICKS
    ? `Great pick! <strong>${p.name}</strong> is in. Now pick a <strong>${nextRole}</strong>.`
    : `Squad complete! Hit <strong>Simulate Tournament</strong>`;

  if (state.picks < MAX_PICKS) {
    document.getElementById('btn-spin').disabled = false;
    document.getElementById('reel').innerHTML = `<div style="color:#fff;opacity:.6;font-size:.9rem;">Spin for your next pick</div>`;
  } else {
    document.getElementById('btn-spin').disabled = true;
    document.getElementById('reel').innerHTML = `<div style="color:var(--gold);font-size:1.1rem;font-weight:800;">✅ XI Complete!</div>`;
  }

  notify(`✅ ${p.name} added!`);
}

// ══════════════════════════════════════════════════════
//  SPIN LOGIC
// ══════════════════════════════════════════════════════

let spinInterval = null;

function doSpin() {
  if (state.spinning || state.spinDone || state.picks >= MAX_PICKS) return;
  state.spinning = true;
  document.getElementById('btn-spin').disabled = true;
  document.getElementById('squad-section').style.display = 'none';

  let ticks = 0;
  const total = rand(14, 22);
  const reel = document.getElementById('reel');

  spinInterval = setInterval(() => {
    ticks++;
    const s = pick(SQUADS);
    reel.style.opacity = '0';
    setTimeout(() => {
      reel.innerHTML = `
        <div class="year-badge">${s.year}</div>
        <div class="team-flag">${s.flag}</div>
        <div class="team-name">${s.team}</div>
        <div class="host-label">📍 ${s.host}</div>`;
      reel.style.opacity = '1';
      reel.classList.add('reel-enter');
      setTimeout(() => reel.classList.remove('reel-enter'), 300);
    }, 80);

    if (ticks >= total) {
      clearInterval(spinInterval);
      const chosen = pick(SQUADS);
      setTimeout(() => {
        reel.style.opacity = '0';
        setTimeout(() => {
          reel.innerHTML = `
            <div class="year-badge">${chosen.year} ${chosen.winner ? '🏆' : ''}</div>
            <div class="team-flag">${chosen.flag}</div>
            <div class="team-name">${chosen.team}</div>
            <div class="host-label">📍 ${chosen.host}</div>`;
          reel.style.opacity = '1';
          state.currentSquad = chosen;
          state.spinning = false;
          state.spinDone = true;
          renderSquad(chosen);
          document.getElementById('spin-info').textContent = `Pick a ${SLOT_LABELS[currentNeededRole()]} from this squad:`;
        }, 80);
      }, 200);
    }
  }, 120);
}

// ══════════════════════════════════════════════════════
//  SIMULATION
// ══════════════════════════════════════════════════════

const OPPONENT_NAMES = [
  { name: 'England', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' }, { name: 'Australia', flag: '🇦🇺' },
  { name: 'India', flag: '🇮🇳' }, { name: 'Pakistan', flag: '🇵🇰' },
  { name: 'South Africa', flag: '🇿🇦' }, { name: 'New Zealand', flag: '🇳🇿' },
  { name: 'Sri Lanka', flag: '🇱🇰' }, { name: 'West Indies', flag: '🇼🇮' },
  { name: 'Bangladesh', flag: '🇧🇩' }, { name: 'Afghanistan', flag: '🇦🇫' },
];

const STAGES = [
  'Group', 'Group', 'Group', 'Group', 'Group', 'Group',
  'Quarter-final', 'Semi-final', 'FINAL'
];

function calcTeamScore(team) {
  const batters = team.filter(p => p.role === 'BAT' || p.role === 'WK' || p.role === 'ALL')
    .sort((a, b) => b.bat - a.bat).slice(0, 6);
  const bowlers = team.filter(p => p.role === 'BWL' || p.role === 'ALL')
    .sort((a, b) => b.bowl - a.bowl).slice(0, 5);
  const batScore = batters.reduce((s, p) => s + p.bat, 0) / 6;
  const bowlScore = bowlers.reduce((s, p) => s + p.bowl, 0) / 5;
  return (batScore * 0.55 + bowlScore * 0.45);
}

function simInnings(teamScore, isYours) {
  const base = teamScore * 2.8;
  const variance = rand(-35, 45);
  return Math.max(80, Math.round(base + variance));
}

function simulateTournament() {
  const myStrength = calcTeamScore(state.team);
  const matches = [];
  let wins = 0;
  let eliminated = false;

  const usedOpponents = new Set();
  // pick opponent names different from player's team names
  const myTeamNames = new Set(state.team.map(p => p.team));

  for (let i = 0; i < STAGES.length; i++) {
    if (eliminated) break;
    const stage = STAGES[i];

    // pick unique opponent
    let opp;
    for (let attempt = 0; attempt < 20; attempt++) {
      const candidate = pick(OPPONENT_NAMES);
      if (!usedOpponents.has(candidate.name) && !myTeamNames.has(candidate.name)) {
        opp = candidate;
        break;
      }
    }
    if (!opp) opp = pick(OPPONENT_NAMES);
    usedOpponents.add(opp.name);

    // opponent strength — gets harder in knockouts
    const knockoutBonus = stage === 'FINAL' ? 8 : stage === 'Semi-final' ? 5 : stage === 'Quarter-final' ? 3 : 0;
    const oppStrength = rand(55, 80) + knockoutBonus;
    const winProb = myStrength / (myStrength + oppStrength);
    const won = Math.random() < winProb;

    const myScore = simInnings(myStrength);
    const oppScore = simInnings(oppStrength);

    // make scores consistent with result
    const adjustedOpp = won
      ? Math.min(myScore - rand(1, 40), myScore - 1)
      : Math.max(myScore + rand(1, 35), myScore + 1);

    matches.push({
      stage,
      opp: `${opp.flag} ${opp.name}`,
      myScore,
      oppScore: Math.max(80, adjustedOpp),
      won,
    });

    if (won) {
      wins++;
    } else if (stage !== 'Group') {
      eliminated = true;
    }
  }

  return matches;
}

function findMVP() {
  return state.team.slice().sort((a, b) => b.rating - a.rating)[0];
}

// ══════════════════════════════════════════════════════
//  RENDER RESULTS
// ══════════════════════════════════════════════════════

function renderResults(matches) {
  const screen = document.getElementById('results-screen');
  const wins = matches.filter(m => m.won).length;
  const total = matches.length;
  const finalMatch = matches[matches.length - 1];
  const champion = wins === total;
  const mvp = findMVP();

  const verdict = champion
    ? 'World Champions! Unbeaten perfection! 🎉'
    : finalMatch.stage === 'FINAL' && !finalMatch.won
    ? 'So close — fell at the final hurdle'
    : finalMatch.stage === 'Semi-final' && !finalMatch.won
    ? 'Semi-final exit — a valiant campaign'
    : finalMatch.stage === 'Quarter-final' && !finalMatch.won
    ? 'Quarter-final knocked out'
    : `${wins} wins from ${total} group games`;

  const trophy = champion ? '🏆' : wins >= 7 ? '🥈' : wins >= 5 ? '🥉' : '🏏';

  screen.innerHTML = `
    <div class="result-header">
      <span class="trophy">${trophy}</span>
      <h2>Tournament Over</h2>
      <div class="record">${wins}–${total - wins}</div>
      <div class="verdict">${verdict}</div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="card-header">Match Results</div>
      <div class="matches-list" style="padding:10px;">
        ${matches.map(m => `
          <div class="match-row">
            <span class="stage">${m.stage}</span>
            <span class="opponent">vs ${m.opp}</span>
            <span class="scores">${m.myScore} – ${m.oppScore}</span>
            <span class="outcome outcome-${m.won ? 'W' : 'L'}">${m.won ? 'WIN' : 'LOSS'}</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="mvp-card">
      <h3>⭐ Player of the Tournament</h3>
      <div class="mvp-name">${mvp.name}</div>
      <div class="mvp-stat">${mvp.flag} ${mvp.team} (${mvp.year}) · Rating ${mvp.rating}</div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div class="card-header">Your Dream XI</div>
      <div style="padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;">
        ${state.team.map((p, i) => `
          <div style="padding:8px;border:1px solid #eee;border-radius:8px;font-size:.82rem;">
            <div style="font-weight:700;">${i + 1}. ${p.name}</div>
            <div style="color:#888;font-size:.72rem;">${p.flag} ${p.team} (${p.year})</div>
            <div><span class="player-role role-${p.role}" style="font-size:.68rem;padding:1px 5px;border-radius:3px;font-weight:700;">${p.role}</span> <span style="font-weight:700;color:var(--green-dark);">${p.rating}</span></div>
          </div>`).join('')}
      </div>
    </div>

    <button id="btn-restart">🔄 Build Another XI</button>
  `;

  document.getElementById('game-screen').style.display = 'none';
  screen.style.display = 'block';
  screen.querySelector('#btn-restart').addEventListener('click', restartGame);
}

// ══════════════════════════════════════════════════════
//  RESTART
// ══════════════════════════════════════════════════════

function restartGame() {
  state = { picks: 0, team: [], pickedIds: new Set(), currentSquad: null, spinning: false, spinDone: false };
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = '';
  document.getElementById('reel').innerHTML = `<div style="color:#fff;opacity:.5;font-size:.9rem;">Press spin to start</div>`;
  document.getElementById('squad-section').style.display = 'none';
  const firstRole = SLOT_LABELS[SLOT_ROLES[0]];
  document.getElementById('spin-info').innerHTML = `Click <strong>SPIN</strong> to pick your first ${firstRole}`;
  document.getElementById('btn-spin').disabled = false;
  document.getElementById('progress-fill').style.width = '0%';
  renderSlots();
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════

renderSlots();

document.getElementById('btn-spin').addEventListener('click', doSpin);
document.getElementById('btn-simulate').addEventListener('click', () => {
  const matches = simulateTournament();
  renderResults(matches);
});
</script>
